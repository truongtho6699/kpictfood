<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPI CT FOOD</title><link rel="stylesheet" href="css/app.css"></head><body><aside><div class="brand">KPI CT FOOD</div><div id="user"></div><nav><button data-view="dashboard" class="active">Tổng quan</button><button data-view="sales">Cập nhật doanh số</button><button data-view="assignments">KPI được giao</button></nav></aside><main><header><div><h1 id="title">Tổng quan</h1><small id="period"></small></div><button id="refresh">Làm mới</button></header><div id="notice"></div><section id="dashboard" class="view"></section><section id="sales" class="view hidden"><div class="card"><h2>Ghi nhận doanh số</h2><form id="saleForm"><div class="grid"><label>Ngày<input name="date" type="date" required></label><label>Khách hàng<input name="customer" required></label><label>Mã khách hàng<input name="customerId"></label><label>Số đơn/Chứng từ<input name="documentNo"></label><label>Doanh số<input name="amount" type="number" min="0" required></label><label>Sản lượng (Kg)<input name="qty" type="number" min="0"></label></div><label>Nội dung<input name="content" value="Bán hàng"></label><label>Ghi chú<textarea name="note"></textarea></label><button type="submit">Gửi kết quả</button></form></div><div id="saleList"></div></section><section id="assignments" class="view hidden"></section></main><script src="js/api.js"></script><script src="js/app.js"></script></body></html>
