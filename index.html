<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPI CT FOOD</title><link rel="stylesheet" href="css/app.css"></head><body>
<aside><div class="brand">KPI <span>CT FOOD</span></div><div id="user"></div><nav>
<button data-view="dashboard" class="active">Tổng quan</button>
<button data-view="perform">Thực hiện</button>
<button data-view="assign" class="manager-only">Giao KPI</button>
<button data-view="income">Thu nhập dự tính</button>
<button data-view="profile">Cá nhân</button>
<button data-view="admin" class="admin-only">Quản trị</button>
</nav></aside>
<main><header><div><h1 id="title">Tổng quan</h1><small id="period"></small></div><button id="refresh">Làm mới</button></header><div id="notice"></div>
<section id="dashboard" class="view"></section>
<section id="perform" class="view hidden"><div class="page-head"><div><h2>Thực hiện chỉ tiêu</h2><p>Ghi nhận kết quả theo các KPI được giao trong kỳ.</p></div></div><div id="performList"></div></section>
<section id="assign" class="view hidden"><div class="card"><h2>Giao KPI</h2><p class="muted">Giao chỉ tiêu xuống cấp dưới theo phạm vi quản lý.</p><form id="assignForm"><div class="grid"><label>Kỳ<input name="period" value="2026-09" required></label><label>Người nhận<select id="assignee" name="assigneeId" required></select></label><label>KPI<select id="kpi" name="kpiCode" required></select></label><label>Target<input name="target" type="number" step="any" required></label><label>Trọng số %<input name="weight" type="number" min="0" max="100" required></label><label>Ngày hết hạn<input name="endDate" type="date"></label></div><label>Ghi chú<textarea name="note"></textarea></label><button type="submit">Giao KPI</button></form></div><div id="assignedList"></div></section>
<section id="income" class="view hidden"><div id="incomeContent"></div></section>
<section id="profile" class="view hidden"><div id="profileContent"></div></section>
<section id="admin" class="view hidden"><div class="tabs"><button data-tab="users" class="active">Người dùng</button><button data-tab="org">Phòng ban & chức vụ</button><button data-tab="kpis">Danh mục KPI</button><button data-tab="salary">Cấu hình 3P</button><button data-tab="payroll">Bảng lương</button></div><div id="adminContent"></div></section>
</main><script src="js/api.js"></script><script src="js/app.js"></script></body></html>
