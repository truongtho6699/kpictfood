<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPI CT FOOD</title><link rel="stylesheet" href="css/app.css"></head><body><aside><div class="brand">KPI CT FOOD</div><div id="user"></div><nav><button data-view="dashboard" class="active">Tổng quan</button><button data-view="sales">Cập nhật doanh số</button><button data-view="assignments">KPI được giao</button><button data-view="assign">Giao KPI</button><button data-view="confirm">Xác nhận</button></nav></aside><main><header><div><h1 id="title">Tổng quan</h1><small id="period"></small></div><button id="refresh">Làm mới</button></header><div id="notice"></div><section id="dashboard" class="view"></section><section id="sales" class="view hidden"><div class="card"><h2>Ghi nhận doanh số</h2><form id="saleForm"><div class="grid"><label>Ngày<input name="date" type="date" required></label><label>Khách hàng<input name="customer" required></label><label>Mã khách hàng<input name="customerId"></label><label>Số đơn/Chứng từ<input name="documentNo"></label><label>Doanh số<input name="amount" type="number" min="0" required></label><label>Sản lượng (Kg)<input name="qty" type="number" min="0"></label></div><label>Nội dung<input name="content" value="Bán hàng"></label><label>Ghi chú<textarea name="note"></textarea></label><button type="submit">Gửi kết quả</button></form></div><div id="saleList"></div></section><section id="assignments" class="view hidden"></section><section id="assign" class="view hidden"><div class="card"><h2>Giao / phân bổ KPI</h2><form id="assignForm"><div class="grid"><label>Kỳ<input name="period" value="2026-09" required></label><label>Cấp nhận<select name="assigneeLevel"><option value="NHAN_VIEN">Nhân viên</option><option value="PHONG">Phòng ban</option></select></label><label>Người/đơn vị nhận<select id="assignee" name="assigneeId" required></select></label><label>KPI<select id="kpi" name="kpiCode" required></select></label><label>Target<input name="target" type="number" min="0" required></label><label>Trọng số %<input name="weight" type="number" min="0" max="100" required></label><label>Ngày hiệu lực<input name="startDate" type="date"></label><label>Ngày hết hạn<input name="endDate" type="date"></label></div><label>Ghi chú<textarea name="note"></textarea></label><button type="submit">Giao KPI</button></form></div></section><section id="confirm" class="view hidden"><div class="card"><h2>Kết quả chờ xác nhận</h2><div id="confirmList"></div></div></section></main><script src="js/api.js"></script><script src="js/app.js"></script></body></html>
