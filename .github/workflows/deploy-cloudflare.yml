name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "wrangler.toml"
      - "package.json"
      - "index.html"
      - "v1/**"
      - "css/**"
      - "js/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: kpictfood-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Remove development dependencies from static assets
        run: rm -rf node_modules
      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4.142.0 deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production health and API routing
        run: |
          set -e
          HEALTH=$(curl -fsS --retry 5 --retry-delay 2 https://kpictfood.truongtho53.workers.dev/health)
          echo "Health: $HEALTH"
          echo "$HEALTH" | grep -q '"ok":true'
          HTTP_CODE=$(curl -sS --retry 5 --retry-delay 2 -o /tmp/api.json -w '%{http_code}' 'https://kpictfood.truongtho53.workers.dev/api?action=masterData')
          echo "API HTTP: $HTTP_CODE"
          cat /tmp/api.json
          test "$HTTP_CODE" = "200"
          grep -q '"error":"AUTH_REQUIRED"' /tmp/api.json
          LOGIN_CODE=$(curl -sS --retry 3 --retry-delay 2 -o /tmp/login.json -w '%{http_code}' -X POST -H 'Content-Type: text/plain;charset=utf-8' --data '{"action":"login","data":{"email":"ceo@ctfoods.vn","password":"Demo1234"}}' https://kpictfood.truongtho53.workers.dev/api)
          echo "Login HTTP: $LOGIN_CODE"
          cat /tmp/login.json | sed -E 's/"token":"[^"]+"/"token":"***"/g'
          test "$LOGIN_CODE" = "200"
          grep -q '"ok":true' /tmp/login.json
          grep -q '"token":' /tmp/login.json
