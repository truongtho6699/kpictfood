name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "wrangler.toml"
      - "package.json"
      - "index.html"
      - "v1/**"
      - "css/**"
      - "js/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: kpictfood-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Remove development dependencies from static assets
        run: rm -rf node_modules
      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4.142.0 deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production health and API routing
        run: |
          set -e
          HEALTH=$(curl -fsS --retry 5 --retry-delay 2 https://kpictfood.truongtho53.workers.dev/health)
          echo "Health: $HEALTH"
          echo "$HEALTH" | grep -q '"ok":true'
          API=$(curl -sS --retry 5 --retry-delay 2 -w  'https://kpictfood.truongtho53.workers.dev/api?action=masterData')
          echo "API response: $API"
          STATUS=$(printf '%s' "$API" | sed -n 's/^HTTP_STATUS://p')
          BODY=$(printf '%s' "$API" | sed '/^HTTP_STATUS:/d')
          test "$STATUS" = "200"
          echo "$BODY" | grep -q '"error":"AUTH_REQUIRED"'
\nHTTP_STATUS:%{http_code}' 'https://kpictfood.truongtho53.workers.dev/api?action=masterData')
          echo "API response: $API"
          STATUS=$(printf '%s' "$API" | sed -n 's/^HTTP_STATUS://p')
          BODY=$(printf '%s' "$API" | sed '/^HTTP_STATUS:/d')
          test "$STATUS" = "200"
          echo "$BODY" | grep -q '"error":"AUTH_REQUIRED"'
