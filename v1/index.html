<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPI CT FOOD</title><link rel="stylesheet" href="/css/app.css"></head><body>
<div id="loginScreen" class="login-screen"><form id="loginForm" class="login-card" method="post" action="javascript:void(0)"><div class="brand login-brand">KPI <span>CT FOOD</span></div><h1>Đăng nhập</h1><p class="muted">Sử dụng tài khoản được cấp theo email công ty.</p><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Mật khẩu<div class="password-wrap"><input id="loginPassword" name="password" type="password" autocomplete="current-password" minlength="8" required><button id="togglePassword" type="button" class="password-toggle" aria-label="Hiện mật khẩu">Hiện</button></div></label><button id="loginButton" type="submit">Đăng nhập</button><div class="login-divider"><span>hoặc</span></div><button id="googleLogin" type="button" class="google-login" aria-label="Đăng nhập bằng Google"><svg class="google-icon" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.482h4.844a4.14 4.14 0 0 1-1.797 2.715v2.258h2.909c1.703-1.568 2.684-3.878 2.684-6.614Z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.181l-2.909-2.258c-.806.54-1.835.859-3.047.859-2.344 0-4.328-1.585-5.037-3.714H.956v2.332A9 9 0 0 0 9 18Z"/><path fill="#FBBC05" d="M3.963 10.706A5.41 5.41 0 0 1 3.682 9c0-.592.102-1.167.281-1.706V4.962H.956A9 9 0 0 0 0 9c0 1.452.347 2.827.956 4.038l3.007-2.332Z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.507.454 3.441 1.345l2.581-2.581C13.463.892 11.426 0 9 0A9 9 0 0 0 .956 4.962l3.007 2.332C4.672 5.165 6.656 3.58 9 3.58Z"/></svg><span>Đăng nhập bằng Google</span></button><div id="loginError" role="alert" aria-live="polite"></div></form></div>
<div id="appShell" class="app-shell hidden">
<aside><div class="brand">KPI <span>CT FOOD</span></div><div id="user"></div><nav>
<button data-view="dashboard" class="active">Tổng quan</button>
<button data-view="perform">Thực hiện</button>
<button data-view="assign" class="manager-only">Giao KPI</button>
<button data-view="income">Thu nhập dự tính</button>
<button data-view="profile">Cá nhân</button>
<button data-view="admin" class="admin-only">Quản trị</button>
</nav><button id="logout" class="logout-btn">Đăng xuất</button></aside>
<main><header><div><h1 id="title">Tổng quan</h1><small id="period"></small></div><button id="refresh">Làm mới</button></header><div id="notice"></div>
<section id="dashboard" class="view"></section>
<section id="perform" class="view hidden"><div class="page-head"><div><h2>Thực hiện chỉ tiêu</h2><p>Ghi nhận kết quả theo các KPI được giao trong kỳ.</p></div></div><div id="performList"></div></section>
<section id="assign" class="view hidden"><div class="card"><h2>Giao KPI</h2><p class="muted">Giao chỉ tiêu xuống cấp dưới theo phạm vi quản lý.</p><form id="assignForm"><div class="grid"><label>Kỳ<input name="period" value="2026-09" required></label><label>Người nhận<select id="assignee" name="assigneeId" required></select></label><label>KPI<select id="kpi" name="kpiCode" required></select></label><label>Target<input id="assignTarget" name="target" type="text" readonly placeholder="Tự lấy theo chức danh"></label><label>Trọng số %<input id="assignWeight" name="weight" type="text" readonly placeholder="Tự lấy theo chức danh"></label><label>Ngày hết hạn<input name="endDate" type="date"></label></div><label>Ghi chú<textarea name="note"></textarea></label><button type="submit">Giao KPI</button></form></div><div id="assignedList"></div></section>
<section id="income" class="view hidden"><div id="incomeContent"></div></section>
<section id="profile" class="view hidden"><div id="profileContent"></div></section>
<section id="admin" class="view hidden"><div class="tabs"><button data-tab="users" class="active">Người dùng</button><button data-tab="org">Phòng ban & chức vụ</button><button data-tab="kpis">Danh mục KPI</button><button data-tab="periods">Kỳ KPI</button><button data-tab="salary">Cấu hình 3P</button><button data-tab="payroll">Bảng lương</button><button data-tab="logs">Nhật ký hệ thống</button></div><div id="adminContent"></div></section>
</main></div><script src="/js/api.js"></script><script src="/js/app.js"></script></body></html>
