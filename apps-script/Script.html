<script>let D=null;const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function call(n,a){return new Promise((ok,no)=>{let r=google.script.run.withSuccessHandler(ok).withFailureHandler(no);a===undefined?r[n]():r[n](a)})}async function load(){try{D=await call('getSimpleAppData');$('#period').textContent='Kỳ '+D.period;$('#who').innerHTML='<b>'+esc(D.user['Họ tên'])+'</b><br><span class="muted">'+esc(D.user['Chức danh'])+'</span>';nav();show('dashboard')}catch(e){$('#app').innerHTML='<div class="card"><h2>Không thể mở chương trình</h2><p>'+esc(e.message)+'</p></div>'}}function nav(){const r=D.user['Vai trò hệ thống'],a=[['dashboard','Tổng quan'],['perform','Thực hiện KPI'],['income','Thu nhập dự tính']];if(['ADMIN','BOARD','EXECUTIVE','MANAGER'].includes(r))a.splice(2,0,['assign','Giao KPI']);if(r==='ADMIN')a.push(['admin','Quản trị']);$('#nav').innerHTML=a.map(x=>'<button data-v="'+x[0]+'" onclick="show(\''+x[0]+'\')">'+x[1]+'</button>').join('')}function show(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));const n={dashboard:'Tổng quan',perform:'Thực hiện KPI',assign:'Giao KPI',income:'Thu nhập dự tính',admin:'Quản trị'};$('#title').textContent=n[v];v==='dashboard'?dashboard():v==='perform'?perform():placeholder(n[v])}function dashboard(){const s=D.summary;$('#app').innerHTML='<div class="grid">'+[['Điểm KPI',s.score.toFixed(2)],['Hoàn thành',Math.round(s.completion*100)+'%'],['Đang thực hiện',s.active],['Đã chốt',s.closed]].map(x=>'<div class="card"><span class="muted">'+x[0]+'</span><div class="metric">'+x[1]+'</div></div>').join('')+'</div><div class="card"><h2>Danh sách KPI</h2>'+cards(D.assignments)+'</div>'}function cards(a){return a.length?a.map(x=>{const r=D.results.find(z=>String(z.ASSIGNMENT_ID)===String(x.ASSIGNMENT_ID))||{};return '<div class="kpi"><div><b>'+esc(x['Tên KPI'])+'</b><br><span class="muted">'+esc(x['Mã KPI'])+'</span></div><div>Target<br><b>'+esc(x.Target===''?'Chờ duyệt':x.Target)+'</b></div><div>Thực hiện<br><b>'+esc(r['Thực hiện']??0)+'</b></div><div>Hoàn thành<br><b>'+(r['% Hoàn thành']===''||r['% Hoàn thành']==null?'—':Math.round(Number(r['% Hoàn thành'])*100)+'%')+'</b></div><span class="badge">'+esc(x['Trạng thái'])+'</span></div>'}).join(''):'<p class="muted">Chưa có KPI trong kỳ.</p>'}function perform(){const a=D.assignments.filter(x=>String(x.ASSIGNEE_ID)===String(D.user.EMPLOYEE_ID)&&x['Trạng thái']!=='DA_CHOT');$('#app').innerHTML='<div class="card"><h2>KPI của tôi</h2>'+a.map(x=>'<div class="kpi"><div><b>'+esc(x['Tên KPI'])+'</b><br><span class="muted">'+esc(x['Mã KPI'])+'</span></div><div>Target<br><b>'+esc(x.Target===''?'Chờ duyệt':x.Target)+'</b></div><div>'+esc(x['Đơn vị'])+'</div><span class="badge">'+esc(x['Trạng thái'])+'</span><button class="primary" onclick="formPerf(\''+x.ASSIGNMENT_ID+'\')">Cập nhật kết quả</button></div>').join('')+'</div><div id="form"></div>'}function formPerf(id){$('#form').innerHTML='<div class="card"><h2>Cập nhật kết quả</h2><form class="form" onsubmit="savePerf(event,\''+id+'\')"><label>Ngày<input name="date" type="date" required></label><label>Giá trị thực hiện<input name="value" type="number" step="any" required></label><label>Minh chứng / Link<input name="evidence"></label><label>Ghi chú<textarea name="note"></textarea></label><button class="primary">Lưu kết quả</button></form></div>'}async function savePerf(e,id){e.preventDefault();const b=e.submitter;b.disabled=true;try{const o=Object.fromEntries(new FormData(e.target));o.assignmentId=id;await call('saveSimplePerformance',o);toast('Đã lưu kết quả');await load();show('perform')}catch(x){toast(x.message)}finally{b.disabled=false}}function placeholder(n){$('#app').innerHTML='<div class="card"><h2>'+n+'</h2><p class="muted">Đang triển khai trên Apps Script trực tiếp từ Google Sheets.</p></div>'}function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2500)}load();</script>
