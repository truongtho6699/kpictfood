<script>let D=null,TOKEN=sessionStorage.getItem('ctfood_token')||'';const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function call(n,a){return new Promise((ok,no)=>{let r=google.script.run.withSuccessHandler(v=>{if(v===null||v===undefined)no(new Error('EMPTY_RESPONSE:'+n));else ok(v)}).withFailureHandler(no);a===undefined?r[n]():r[n](a)})}async function load(){try{D=await call('getSimpleAppData',TOKEN);if(!D||!D.user){TOKEN='';sessionStorage.removeItem('ctfood_token');return loginScreen()}$('#period').textContent='Kỳ '+D.period;$('#who').innerHTML='<b>'+esc(D.user['Họ tên'])+'</b><br><span class="muted">'+esc(D.user['Chức danh'])+' · <a href="#" onclick="logout();return false">Đăng xuất</a></span>';nav();show('dashboard')}catch(e){if(String(e.message||e).includes('LOGIN_REQUIRED')||String(e.message||e).includes('SESSION_')||String(e.message||e).includes('EMPTY_RESPONSE:getSimpleAppData'))return loginScreen();$('#app').innerHTML='<div class="card"><h2>Không thể mở chương trình</h2><p>'+esc(e.message)+'</p></div>'}}function nav(){const r=D.user['Vai trò hệ thống'],a=[['dashboard','Tổng quan'],['perform','Thực hiện KPI'],['income','Thu nhập dự tính']];if(['ADMIN','BOARD','EXECUTIVE','MANAGER'].includes(r))a.splice(2,0,['assign','Giao KPI']);if(r==='ADMIN')a.push(['admin','Quản trị']);$('#nav').innerHTML=a.map(x=>'<button data-v="'+x[0]+'" onclick="show(\''+x[0]+'\')">'+x[1]+'</button>').join('')}function show(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));const n={dashboard:'Tổng quan',perform:'Thực hiện KPI',assign:'Giao KPI',income:'Thu nhập dự tính',admin:'Quản trị'};$('#title').textContent=n[v];v==='dashboard'?dashboard():v==='perform'?perform():v==='assign'?assign():v==='income'?income():admin()}function dashboard(){const s=D.summary;$('#app').innerHTML='<div class="grid">'+[['Điểm KPI',s.score.toFixed(2)],['Hoàn thành',Math.round(s.completion*100)+'%'],['Đang thực hiện',s.active],['Đã chốt',s.closed]].map(x=>'<div class="card"><span class="muted">'+x[0]+'</span><div class="metric">'+x[1]+'</div></div>').join('')+'</div>'+orgBlock()+'<div class="card"><h2>Danh sách KPI</h2>'+cards(D.assignments)+'</div>'}function orgBlock(){const role=D.user['Vai trò hệ thống'];if(!['ADMIN','BOARD','EXECUTIVE','MANAGER'].includes(role))return'';const a=D.orgSummary||[];return '<div class="card"><h2>'+(role==='MANAGER'?'Tổng quan phòng ban':'Tổng quan đơn vị')+'</h2>'+a.map(x=>'<div class="kpi"><div><b>'+esc(x.department)+'</b><br><span class="muted">'+x.employees+' nhân sự</span></div><div>Điểm<br><b>'+Number(x.score||0).toFixed(2)+'</b></div><div>Hoàn thành<br><b>'+Math.round(Number(x.completion||0)*100)+'%</b></div><div>Đang làm<br><b>'+x.active+'</b></div><span class="badge">'+(x.attention?'Cần chú ý '+x.attention:'Ổn định')+'</span></div>').join('')+'</div>'}function cards(a){return a.length?a.map(x=>{const r=D.results.find(z=>String(z.ASSIGNMENT_ID)===String(x.ASSIGNMENT_ID))||{};return '<div class="kpi"><div><b>'+esc(x['Tên KPI'])+'</b><br><span class="muted">'+esc(x['Mã KPI'])+'</span></div><div>Target<br><b>'+esc(x.Target===''?'Chờ duyệt':x.Target)+'</b></div><div>Thực hiện<br><b>'+esc(r['Thực hiện']??0)+'</b></div><div>Hoàn thành<br><b>'+(r['% Hoàn thành']===''||r['% Hoàn thành']==null?'—':Math.round(Number(r['% Hoàn thành'])*100)+'%')+'</b></div><div><span class="badge">'+esc(x['Trạng thái'])+'</span>'+((['ADMIN','BOARD','EXECUTIVE'].includes(D.user['Vai trò hệ thống'])&&r['Trạng thái dữ liệu']==='DA_XAC_NHAN'&&x['Trạng thái']!=='DA_CHOT')?'<br><button class="primary" onclick="closeKpi(\''+x.ASSIGNMENT_ID+'\')">Chốt KPI</button>':'')+'</div></div>'}).join(''):'<p class="muted">Chưa có KPI trong kỳ.</p>'}async function closeKpi(id){try{await call('simpleCloseAssignment',{id,token:TOKEN});toast('Đã chốt KPI');await load();show('dashboard')}catch(e){toast(e.message)}}
function perform(){const a=D.assignments.filter(x=>String(x.ASSIGNEE_ID)===String(D.user.EMPLOYEE_ID)&&x['Trạng thái']!=='DA_CHOT');$('#app').innerHTML='<div class="card"><h2>KPI của tôi</h2>'+a.map(x=>'<div class="kpi"><div><b>'+esc(x['Tên KPI'])+'</b><br><span class="muted">'+esc(x['Mã KPI'])+'</span></div><div>Target<br><b>'+esc(x.Target===''?'Chờ duyệt':x.Target)+'</b></div><div>'+esc(x['Đơn vị'])+'</div><span class="badge">'+esc(x['Trạng thái'])+'</span>'+(x['Trạng thái']==='DA_GIAO'?'<button class="primary" onclick="acceptKpi(\''+x.ASSIGNMENT_ID+'\')">Nhận KPI</button>':'<button class="primary" onclick="formPerf(\''+x.ASSIGNMENT_ID+'\')">Cập nhật kết quả</button>')+'</div>').join('')+'</div><div id="form"></div>'}function formPerf(id){$('#form').innerHTML='<div class="card"><h2>Cập nhật kết quả</h2><form class="form" onsubmit="savePerf(event,\''+id+'\')"><label>Ngày<input name="date" type="date" required></label><label>Giá trị thực hiện<input name="value" type="number" step="any" required></label><label>Minh chứng / Link<input name="evidence"></label><label>Ghi chú<textarea name="note"></textarea></label><button class="primary">Lưu kết quả</button></form></div>'}async function savePerf(e,id){e.preventDefault();const b=e.submitter;b.disabled=true;try{const o=Object.fromEntries(new FormData(e.target));o.assignmentId=id;o.token=TOKEN;await call('saveSimplePerformance',o);toast('Đã lưu kết quả');await load();show('perform')}catch(x){toast(x.message)}finally{b.disabled=false}}async function acceptKpi(id){try{await call('simpleAcceptAssignment',{id,token:TOKEN});toast('Đã nhận KPI');await load();show('perform')}catch(e){toast(e.message)}}
function assign(){const role=D.user['Vai trò hệ thống'],pending=D.performance.filter(x=>x['Trạng thái']==='DA_GUI');let h='<div class="card"><h2>Chờ xác nhận</h2>'+ (pending.length?pending.map(x=>'<div class="kpi"><div><b>'+esc(x['Nhân viên'])+'</b><br><span class="muted">'+esc(x['Tên KPI'])+'</span></div><div>'+esc(x['Ngày'])+'</div><div><b>'+esc(x['Giá trị thực hiện'])+'</b> '+esc(x['Đơn vị'])+'</div><button class="primary" onclick="confirmPerf(\''+x.RECORD_ID+'\',true)">Xác nhận</button><button class="secondary" onclick="confirmPerf(\''+x.RECORD_ID+'\',false)">Từ chối</button></div>').join(''):'<p class="muted">Không có kết quả chờ xác nhận.</p>')+'</div>';if(['ADMIN','BOARD','EXECUTIVE','MANAGER'].includes(role)){const es=D.employees.filter(x=>String(x.EMPLOYEE_ID)!==String(D.user.EMPLOYEE_ID));h+='<div class="card"><h2>Giao KPI</h2><form class="form" onsubmit="createAsn(event)"><label>Nhân viên<select name="employeeId" onchange="loadRoleKpis(this.value)" required><option value="">Chọn nhân viên</option>'+es.map(x=>'<option value="'+esc(x.EMPLOYEE_ID)+'">'+esc(x['Họ tên'])+' · '+esc(x['Phòng ban'])+'</option>').join('')+'</select></label><label>Vị trí KPI<input id="position" name="position" readonly required></label><label>KPI<select id="kpiCode" name="kpiCode" required><option value="">Chọn nhân viên trước</option></select></label><label>Target (để trống dùng mặc định)<input name="target" type="number" step="any"></label><button class="primary">Giao KPI</button></form></div>'}$('#app').innerHTML=h}
async function confirmPerf(id,ok){try{await new Promise((yes,no)=>google.script.run.withSuccessHandler(yes).withFailureHandler(no).simpleConfirmPerformance({id,approved:ok,token:TOKEN}));toast(ok?'Đã xác nhận':'Đã từ chối');await load();show('assign')}catch(e){toast(e.message)}}
async function loadRoleKpis(emp){if(!emp)return;try{const r=await call('simplePositionOptions',{employeeId:emp,token:TOKEN});$('#position').value=r.position||'';$('#kpiCode').innerHTML=r.kpis.length?r.kpis.map(x=>'<option value="'+esc(x['Mã KPI'])+'">'+esc(x['Mã KPI'])+' · '+esc(x['Tên KPI'])+' · '+esc(x['Trọng số mặc định %'])+'%</option>').join(''):'<option value="">Chưa có cấu hình KPI hợp lệ</option>'}catch(e){toast(e.message)}}
async function createAsn(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.token=TOKEN;try{await call('simpleCreateAssignment',d);toast('Đã giao KPI');await load();show('assign')}catch(x){toast(x.message)}}
function income(){const x=D.income;$('#app').innerHTML=x?'<div class="card"><h2>Thu nhập dự tính</h2><div class="metric">'+esc(x.target||0)+' đ</div><p>Điểm KPI: <b>'+Number(x.score||0).toFixed(2)+'</b></p><p>1P: <b>'+esc(x.p1)+'</b> · 2P: <b>'+esc(x.p2)+'</b> · 3P: <b>'+esc(x.p3)+'</b></p><p class="muted">1P và 3P chưa tự tính thành tiền khi chưa có công thức được phê duyệt.</p></div>':'<div class="card"><h2>Thu nhập dự tính</h2><p class="muted">Chưa có lương KPI mục tiêu/cấu hình cho kỳ này.</p></div>'}
function admin(){const role=D.user['Vai trò hệ thống'];$('#app').innerHTML=role==='ADMIN'?'<div class="grid"><div class="card"><span class="muted">Nhân viên</span><div class="metric">'+D.employees.length+'</div></div><div class="card"><span class="muted">KPI được giao</span><div class="metric">'+D.assignments.length+'</div></div><div class="card"><span class="muted">Kết quả ghi nhận</span><div class="metric">'+D.performance.length+'</div></div><div class="card"><span class="muted">Kỳ hiện tại</span><div class="metric">'+esc(D.period)+'</div></div></div><div class="card"><h2>Quản trị đơn giản</h2><p class="muted">Danh mục nhân viên, KPI và cấu hình tiếp tục được quản lý trực tiếp trong Google Trang tính. Web App tập trung vào giao, thực hiện, xác nhận và theo dõi KPI.</p></div>':'<div class="card"><p>Không có quyền quản trị.</p></div>'}
function loginScreen(){document.querySelector('aside').style.display='none';document.querySelector('main').style.margin='0';document.querySelector('main').style.width='100%';document.querySelector('header').style.display='none';$('#app').innerHTML='<div class="login-wrap"><div class="login-card"><div class="login-logo">CT FOOD</div><h2>Quản trị hiệu suất</h2><p class="muted">Đăng nhập bằng tài khoản được cấp</p><form class="form" onsubmit="doLogin(event)"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Đăng nhập</button><div id="loginError" class="error-text"></div></form></div></div>'}async function doLogin(e){e.preventDefault();const b=e.submitter;b.disabled=true;$('#loginError').textContent='';try{const d=Object.fromEntries(new FormData(e.target)),r=await call('simpleLogin',d);TOKEN=r.token;sessionStorage.setItem('ctfood_token',TOKEN);document.querySelector('aside').style.display='block';document.querySelector('main').style.margin='';document.querySelector('main').style.width='';document.querySelector('header').style.display='flex';await load()}catch(x){$('#loginError').textContent='Email hoặc mật khẩu không đúng.'}finally{b.disabled=false}}async function logout(){try{if(TOKEN)await call('simpleLogout',TOKEN)}catch(e){}TOKEN='';sessionStorage.removeItem('ctfood_token');loginScreen()}
function placeholder(n){$('#app').innerHTML='<div class="card"><h2>'+n+'</h2><p class="muted">Đang triển khai trên Apps Script trực tiếp từ Google Sheets.</p></div>'}function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2500)}load();</script>
