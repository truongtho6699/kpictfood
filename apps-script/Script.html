<script>let D=null,TOKEN=sessionStorage.getItem('ctfood_token')||'';const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function call(n,a){return new Promise((ok,no)=>{let r=google.script.run.withSuccessHandler(v=>{if(v===null||v===undefined)no(new Error('EMPTY_RESPONSE:'+n));else ok(v)}).withFailureHandler(no);a===undefined?r[n]():r[n](a)})}async function load(){try{D=await call('getSimpleAppData',TOKEN);if(!D||!D.user){TOKEN='';sessionStorage.removeItem('ctfood_token');return loginScreen()}$('#period').innerHTML='<select id="periodSelect" onchange="changePeriod(this.value)">'+periodOptions(D.period)+'</select>';$('#who').innerHTML='<b>'+esc(D.user['Họ tên'])+'</b><br><span class="muted">'+esc(D.user['Chức danh'])+' · <a href="#" onclick="logout();return false">Đăng xuất</a></span>';nav();show('dashboard')}catch(e){if(String(e.message||e).includes('LOGIN_REQUIRED')||String(e.message||e).includes('SESSION_')||String(e.message||e).includes('EMPTY_RESPONSE:getSimpleAppData'))return loginScreen();$('#app').innerHTML='<div class="card"><h2>Không thể mở chương trình</h2><p>'+esc(e.message)+'</p></div>'}}function periodOptions(p){const y=Number(String(p).slice(0,4))||2026;return Array.from({length:12},(_,i)=>{const v=y+'-'+String(i+1).padStart(2,'0');return '<option value="'+v+'" '+(v===p?'selected':'')+'>Kỳ '+v+'</option>'}).join('')}async function changePeriod(p){try{D=await call('getSimpleAppDataForPeriod',{token:TOKEN,period:p});$('#period').innerHTML='<select id="periodSelect" onchange="changePeriod(this.value)">'+periodOptions(D.period)+'</select>';nav();show('dashboard')}catch(e){toast(e.message)}}function nav(){const r=D.user['Vai trò hệ thống'],a=[['dashboard','Tổng quan'],['perform','Thực hiện KPI'],['income','Thu nhập dự tính']];if(['ADMIN','BOARD','EXECUTIVE','MANAGER'].includes(r))a.splice(2,0,['assign','Giao KPI']);if(r==='ADMIN')a.push(['admin','Quản trị']);$('#nav').innerHTML=a.map(x=>'<button data-v="'+x[0]+'" onclick="show(\''+x[0]+'\')">'+x[1]+'</button>').join('')}function show(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));const n={dashboard:'Tổng quan',perform:'Thực hiện KPI',assign:'Giao KPI',income:'Thu nhập dự tính',admin:'Quản trị'};$('#title').textContent=n[v];v==='dashboard'?dashboard():v==='perform'?perform():v==='assign'?assign():v==='income'?income():admin()}function dashboard(){const s=D.summary;$('#app').innerHTML='<div class="grid">'+[['Điểm KPI',s.score.toFixed(2)],['Hoàn thành',Math.round(s.completion*100)+'%'],['Đang thực hiện',s.active],['Đã chốt',s.closed]].map(x=>'<div class="card"><span class="muted">'+x[0]+'</span><div class="metric">'+x[1]+'</div></div>').join('')+'</div>'+orgBlock()+'<div class="card"><div class="section-head"><div><h2>Kết quả theo nhân sự</h2><p class="muted">Theo kỳ đang chọn</p></div><button class="secondary" onclick="refreshResultTable()">Xem kết quả</button></div><div id="employeeResults"><p class="muted">Bấm Xem kết quả để tải danh sách.</p></div></div><div class="card"><h2>Danh sách KPI</h2>'+cards(D.assignments)+'</div>'}async function refreshResultTable(){try{const a=await call('simpleEmployeeResultSummary',{token:TOKEN,period:D.period});const el=$('#employeeResults');if(!el)return;el.innerHTML=a.length?'<div class="table-wrap"><table><thead><tr><th>Nhân sự</th><th>Phòng ban</th><th>KPI</th><th>Hoàn thành</th><th>Điểm</th><th>Cần chú ý</th></tr></thead><tbody>'+a.map(x=>'<tr><td><b>'+esc(x.name)+'</b><br><span class="muted">'+esc(x.title)+'</span></td><td>'+esc(x.department)+'</td><td>'+x.assigned+'</td><td>'+Math.round(Number(x.completion||0)*100)+'%</td><td>'+Number(x.score||0).toFixed(2)+'</td><td>'+(x.attention?'<span class="badge">'+x.attention+' KPI</span>':'—')+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted">Chưa có dữ liệu.</p>'}catch(e){toast(e.message)}}function orgBlock(){const role=D.user['Vai trò hệ thống'];if(!['ADMIN','BOARD','EXECUTIVE','MANAGER'].includes(role))return'';const a=D.orgSummary||[];return '<div class="card"><h2>'+(role==='MANAGER'?'Tổng quan phòng ban':'Tổng quan đơn vị')+'</h2>'+a.map(x=>'<div class="kpi"><div><b>'+esc(x.department)+'</b><br><span class="muted">'+x.employees+' nhân sự</span></div><div>Điểm<br><b>'+Number(x.score||0).toFixed(2)+'</b></div><div>Hoàn thành<br><b>'+Math.round(Number(x.completion||0)*100)+'%</b></div><div>Đang làm<br><b>'+x.active+'</b></div><span class="badge">'+(x.attention?'Cần chú ý '+x.attention:'Ổn định')+'</span></div>').join('')+'</div>'}function cards(a){return a.length?a.map(x=>{const r=D.results.find(z=>String(z.ASSIGNMENT_ID)===String(x.ASSIGNMENT_ID))||{};return '<div class="kpi"><div><b>'+esc(x['Tên KPI'])+'</b><br><span class="muted">'+esc(x['Mã KPI'])+'</span></div><div>Target<br><b>'+esc(x.Target===''?'Chờ duyệt':x.Target)+'</b></div><div>Thực hiện<br><b>'+esc(r['Thực hiện']??0)+'</b></div><div>Hoàn thành<br><b>'+(r['% Hoàn thành']===''||r['% Hoàn thành']==null?'—':Math.round(Number(r['% Hoàn thành'])*100)+'%')+'</b></div><div><span class="badge">'+esc(x['Trạng thái'])+'</span>'+((['ADMIN','BOARD','EXECUTIVE'].includes(D.user['Vai trò hệ thống'])&&r['Trạng thái dữ liệu']==='DA_XAC_NHAN'&&x['Trạng thái']!=='DA_CHOT')?'<br><button class="primary" onclick="closeKpi(\''+x.ASSIGNMENT_ID+'\')">Chốt KPI</button>':'')+'</div></div>'}).join(''):'<p class="muted">Chưa có KPI trong kỳ.</p>'}async function closeKpi(id){try{await call('simpleCloseAssignment',{id,token:TOKEN});toast('Đã chốt KPI');await load();show('dashboard')}catch(e){toast(e.message)}}
function perform(){const a=D.assignments.filter(x=>String(x.ASSIGNEE_ID)===String(D.user.EMPLOYEE_ID)&&x['Trạng thái']!=='DA_CHOT');const today=new Date().toISOString().slice(0,10);$('#app').innerHTML='<div class="card"><div class="section-head"><div><h2>Thực hiện KPI</h2><p class="muted">Nhập kết quả hằng ngày theo từng chỉ tiêu.</p></div><label>Ngày<input id="dailyDate" type="date" value="'+today+'"></label></div><div class="table-wrap"><table><thead><tr><th>Mã KPI</th><th>Tên KPI</th><th>Đơn vị</th><th>KQ thực hiện</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(x['Mã KPI'])+'</td><td>'+esc(x['Tên KPI'])+'</td><td>'+esc(x['Đơn vị'])+'</td><td><input class="daily-kpi" data-id="'+esc(x.ASSIGNMENT_ID)+'" type="number" step="any" inputmode="decimal"></td></tr>').join('')+'</tbody></table></div><button class="primary save-wide" onclick="saveDailyKpis()">Lưu kết quả</button></div><div class="card"><h2>Lịch sử trong kỳ</h2>'+historyTable()+'</div>'}function historyTable(){const a=(D.performance||[]).filter(x=>String(x.EMPLOYEE_ID)===String(D.user.EMPLOYEE_ID));return a.length?'<div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Mã KPI</th><th>Kết quả</th><th>Trạng thái</th></tr></thead><tbody>'+a.slice().reverse().map(x=>'<tr><td>'+esc(x['Ngày'])+'</td><td>'+esc(x['Mã KPI'])+'</td><td>'+esc(x['Giá trị thực hiện'])+' '+esc(x['Đơn vị'])+'</td><td>'+esc(x['Trạng thái'])+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted">Chưa có dữ liệu thực hiện.</p>'}async function saveDailyKpis(){const items=[...document.querySelectorAll('.daily-kpi')].map(x=>({assignmentId:x.dataset.id,value:x.value})).filter(x=>x.value!=='');if(!items.length)return toast('Chưa nhập kết quả');try{const r=await call('simpleSaveDailyKpis',{token:TOKEN,date:$('#dailyDate').value,items});toast('Đã lưu '+r.count+' kết quả');D=await call('getSimpleAppDataForPeriod',{token:TOKEN,period:D.period});show('perform')}catch(e){toast(e.message)}}function formPerf(id){$('#form').innerHTML='<div class="card"><h2>Cập nhật kết quả</h2><form class="form" onsubmit="savePerf(event,\''+id+'\')"><label>Ngày<input name="date" type="date" required></label><label>Giá trị thực hiện<input name="value" type="number" step="any" required></label><label>Minh chứng / Link<input name="evidence"></label><label>Ghi chú<textarea name="note"></textarea></label><button class="primary">Lưu kết quả</button></form></div>'}async function savePerf(e,id){e.preventDefault();const b=e.submitter;b.disabled=true;try{const o=Object.fromEntries(new FormData(e.target));o.assignmentId=id;o.token=TOKEN;await call('saveSimplePerformance',o);toast('Đã lưu kết quả');await load();show('perform')}catch(x){toast(x.message)}finally{b.disabled=false}}async function acceptKpi(id){try{await call('simpleAcceptAssignment',{id,token:TOKEN});toast('Đã nhận KPI');await load();show('perform')}catch(e){toast(e.message)}}
function assign(){const role=D.user['Vai trò hệ thống'],pending=D.performance.filter(x=>x['Trạng thái']==='DA_GUI');let h='<div class="card"><h2>Chờ xác nhận</h2>'+ (pending.length?pending.map(x=>'<div class="kpi"><div><b>'+esc(x['Nhân viên'])+'</b><br><span class="muted">'+esc(x['Tên KPI'])+'</span></div><div>'+esc(x['Ngày'])+'</div><div><b>'+esc(x['Giá trị thực hiện'])+'</b> '+esc(x['Đơn vị'])+'</div><button class="primary" onclick="confirmPerf(\''+x.RECORD_ID+'\',true)">Xác nhận</button><button class="secondary" onclick="confirmPerf(\''+x.RECORD_ID+'\',false)">Từ chối</button></div>').join(''):'<p class="muted">Không có kết quả chờ xác nhận.</p>')+'</div>';if(['ADMIN','BOARD','EXECUTIVE','MANAGER'].includes(role)){const es=D.employees.filter(x=>String(x.EMPLOYEE_ID)!==String(D.user.EMPLOYEE_ID));h+='<div class="card"><h2>Giao KPI</h2><form class="form" onsubmit="createAsn(event)"><label>Nhân viên<select name="employeeId" onchange="loadRoleKpis(this.value)" required><option value="">Chọn nhân viên</option>'+es.map(x=>'<option value="'+esc(x.EMPLOYEE_ID)+'">'+esc(x['Họ tên'])+' · '+esc(x['Phòng ban'])+'</option>').join('')+'</select></label><label>Vị trí KPI<input id="position" name="position" readonly required></label><label>KPI<select id="kpiCode" name="kpiCode" required><option value="">Chọn nhân viên trước</option></select></label><label>Target (để trống dùng mặc định)<input name="target" type="number" step="any"></label><div class="form-actions"><button class="primary">Giao KPI</button><button class="secondary" type="button" onclick="bulkAssign()">Giao toàn bộ KPI vị trí</button></div></form></div>'}$('#app').innerHTML=h}
async function confirmPerf(id,ok){try{await new Promise((yes,no)=>google.script.run.withSuccessHandler(yes).withFailureHandler(no).simpleConfirmPerformance({id,approved:ok,token:TOKEN}));toast(ok?'Đã xác nhận':'Đã từ chối');await load();show('assign')}catch(e){toast(e.message)}}
async function loadRoleKpis(emp){if(!emp)return;try{const r=await call('simplePositionOptions',{employeeId:emp,token:TOKEN});$('#position').value=r.position||'';$('#kpiCode').innerHTML=r.kpis.length?r.kpis.map(x=>'<option value="'+esc(x['Mã KPI'])+'">'+esc(x['Mã KPI'])+' · '+esc(x['Tên KPI'])+' · '+esc(x['Trọng số mặc định %'])+'%</option>').join(''):'<option value="">Chưa có cấu hình KPI hợp lệ</option>'}catch(e){toast(e.message)}}
async function bulkAssign(){const emp=document.querySelector('[name="employeeId"]')?.value,pos=$('#position')?.value;if(!emp||!pos)return toast('Hãy chọn nhân viên');try{const r=await call('simpleBulkAssignRoleKpis',{token:TOKEN,employeeId:emp,position:pos,period:D.period});toast('Đã giao '+r.count+' KPI');D=await call('getSimpleAppDataForPeriod',{token:TOKEN,period:D.period});show('assign')}catch(e){toast(e.message)}}async function createAsn(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.token=TOKEN;d.period=D.period;try{await call('simpleCreateAssignment',d);toast('Đã giao KPI');await load();show('assign')}catch(x){toast(x.message)}}
function income(){const x=D.income,f=n=>Number(n||0).toLocaleString('vi-VN')+' đ';$('#app').innerHTML=x?'<div class="grid"><div class="card"><span class="muted">1P</span><div class="metric">'+f(x.p1)+'</div></div><div class="card"><span class="muted">2P</span><div class="metric">'+f(x.p2)+'</div></div><div class="card"><span class="muted">3P</span><div class="metric">'+f(x.p3)+'</div></div><div class="card"><span class="muted">Tổng dự tính</span><div class="metric">'+f(x.total)+'</div></div></div><div class="card"><h2>Thu nhập kỳ '+esc(D.period)+'</h2><p>Điểm KPI hiện tại: <b>'+Number(x.score||0).toFixed(2)+'</b></p><p class="muted">Các khoản 1P, 2P, 3P do Quản trị nhập cho từng nhân viên.</p></div>':'<div class="card"><h2>Thu nhập dự tính</h2><p class="muted">Chưa nhập mức 1P, 2P, 3P cho kỳ '+esc(D.period)+'.</p></div>'}
function admin(){const role=D.user['Vai trò hệ thống'];if(role!=='ADMIN'){return $('#app').innerHTML='<div class="card"><p>Không có quyền quản trị.</p></div>'}$('#app').innerHTML='<div class="card"><div class="section-head"><div><h2>Quản trị kỳ '+esc(D.period)+'</h2><p class="muted">Nhân sự, lương và cấu hình KPI dùng trực tiếp trên Google Sheets.</p></div></div></div>'+'<div class="grid"><div class="card"><span class="muted">Nhân viên</span><div class="metric">'+D.employees.length+'</div></div><div class="card"><span class="muted">KPI được giao</span><div class="metric">'+D.assignments.length+'</div></div><div class="card"><span class="muted">Kết quả ghi nhận</span><div class="metric">'+D.performance.length+'</div></div><div class="card"><span class="muted">Kỳ</span><div class="metric">'+esc(D.period)+'</div></div></div><div class="card"><h2>Nhập lương 1P · 2P · 3P</h2><form class="form salary-form" onsubmit="saveSalary(event)"><label>Nhân viên<select name="employeeId" required><option value="">Chọn nhân viên</option>'+D.employees.map(x=>'<option value="'+esc(x.EMPLOYEE_ID)+'">'+esc(x['Họ tên'])+' · '+esc(x['Chức danh'])+'</option>').join('')+'</select></label><label>1P (đồng)<input name="p1" type="number" min="0" required></label><label>2P (đồng)<input name="p2" type="number" min="0" required></label><label>3P (đồng)<input name="p3" type="number" min="0" required></label><button class="primary">Lưu mức lương</button></form><hr><h3>Tài khoản kiểm thử</h3><p class="muted">Khởi tạo/đặt lại toàn bộ tài khoản nhân sự về mật khẩu mặc định 123456.</p><button class="secondary" onclick="bootstrapAccounts()">Khởi tạo tài khoản kiểm thử</button></div><div class="card"><h2>Danh mục KPI</h2><form class="form" onsubmit="saveKpi(event)"><label>Mã KPI<input name="code" required></label><label>Tên KPI<input name="name" required></label><label>Đơn vị<input name="unit"></label><label>Chiều<select name="direction"><option>Tăng</option><option>Giảm</option></select></label><label>Target tham chiếu<input name="referenceTarget" type="number" step="any"></label><button class="primary">Lưu KPI</button></form></div><div class="card"><h2>Gắn KPI theo vị trí</h2><form class="form" onsubmit="saveRoleKpi(event)"><label>Vị trí<input name="position" placeholder="Ví dụ: Sale – Nhân viên" required></label><label>KPI<select name="code" required>'+D.kpis.map(x=>'<option value="'+esc(x['Mã KPI'])+'">'+esc(x['Mã KPI'])+' · '+esc(x['Tên KPI'])+'</option>').join('')+'</select></label><label>Trọng số %<input name="weight" type="number" step="any" min="0" max="100"></label><label>Target<input name="target" type="number" step="any"></label><button class="primary">Lưu cấu hình</button></form></div><div class="card"><h2>Danh sách nhân sự</h2><div class="table-wrap"><table><thead><tr><th>Mã NV</th><th>Họ tên</th><th>Email</th><th>Phòng ban</th><th>Chức danh</th></tr></thead><tbody>'+D.employees.map(x=>'<tr><td>'+esc(x.EMPLOYEE_ID)+'</td><td>'+esc(x['Họ tên'])+'</td><td>'+esc(x.Email)+'</td><td>'+esc(x['Phòng ban'])+'</td><td>'+esc(x['Chức danh'])+'</td></tr>').join('')+'</tbody></table></div></div>'}async function saveKpi(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.token=TOKEN;try{await call('simpleAdminSaveKpi',d);toast('Đã lưu KPI');D=await call('getSimpleAppDataForPeriod',{token:TOKEN,period:D.period});show('admin')}catch(x){toast(x.message)}}async function saveRoleKpi(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.token=TOKEN;try{await call('simpleAdminSaveRoleKpi',d);toast('Đã lưu KPI theo vị trí');D=await call('getSimpleAppDataForPeriod',{token:TOKEN,period:D.period});show('admin')}catch(x){toast(x.message)}}async function saveEmployee(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.token=TOKEN;try{const r=await call('simpleAdminUpsertEmployee',d);toast('Đã thêm nhân sự · '+r.email);D=await call('getSimpleAppDataForPeriod',{token:TOKEN,period:D.period});show('admin')}catch(x){toast(x.message)}}async function saveSalary(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.token=TOKEN;d.period=D.period;d.total=Number(d.p1||0)+Number(d.p2||0)+Number(d.p3||0);try{await call('simpleSaveSalary3P',d);toast('Đã lưu lương 1P · 2P · 3P');D=await call('getSimpleAppDataForPeriod',{token:TOKEN,period:D.period})}catch(x){toast(x.message)}}async function bootstrapAccounts(){if(!confirm('Đặt lại mật khẩu toàn bộ tài khoản nhân sự về 123456?'))return;try{const r=await call('simpleAdminBootstrapAccounts',{token:TOKEN});toast('Đã xử lý '+(Number(r.created||0)+Number(r.reset||0))+' tài khoản')}catch(e){toast(e.message)}}function loginScreen(){document.querySelector('aside').style.display='none';document.querySelector('main').style.margin='0';document.querySelector('main').style.width='100%';document.querySelector('header').style.display='none';$('#app').innerHTML='<div class="login-wrap"><div class="login-card"><div class="login-logo">CT FOOD</div><h2>Quản trị hiệu suất</h2><p class="muted">Đăng nhập bằng tài khoản được cấp</p><form class="form" onsubmit="doLogin(event)"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Mật khẩu<div class="password-box"><input id="loginPassword" name="password" type="password" autocomplete="current-password" required><button type="button" class="password-toggle" onclick="togglePassword()" aria-label="Hiện hoặc ẩn mật khẩu">Hiện</button></div></label><button class="primary" type="submit">Đăng nhập</button><div id="loginError" class="error-text"></div></form></div></div>'}function togglePassword(){const p=$('#loginPassword'),b=document.querySelector('.password-toggle');if(!p)return;p.type=p.type==='password'?'text':'password';if(b)b.textContent=p.type==='password'?'Hiện':'Ẩn'}async function doLogin(e){e.preventDefault();const b=e.submitter;b.disabled=true;$('#loginError').textContent='';let r;try{const d=Object.fromEntries(new FormData(e.target));r=await call('simpleLogin',d)}catch(x){$('#loginError').textContent='Email hoặc mật khẩu không đúng.';b.disabled=false;return}TOKEN=r.token;sessionStorage.setItem('ctfood_token',TOKEN);document.querySelector('aside').style.display='block';document.querySelector('main').style.margin='';document.querySelector('main').style.width='';document.querySelector('header').style.display='flex';try{await load()}catch(x){$('#loginError').textContent='Đăng nhập thành công nhưng không tải được dữ liệu: '+String(x.message||x)}finally{b.disabled=false}}async function logout(){try{if(TOKEN)await call('simpleLogout',TOKEN)}catch(e){}TOKEN='';sessionStorage.removeItem('ctfood_token');loginScreen()}
function placeholder(n){$('#app').innerHTML='<div class="card"><h2>'+n+'</h2><p class="muted">Đang triển khai trên Apps Script trực tiếp từ Google Sheets.</p></div>'}function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2500)}load();</script>
